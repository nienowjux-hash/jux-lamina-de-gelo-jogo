<script>
'use strict';
if(typeof fimCarregar==='function')window.addEventListener('load',fimCarregar);else {const el=document.getElementById('carregando');if(el){el.style.transition='opacity .4s';el.style.opacity='0';setTimeout(()=>el.remove(),450);}}   // carrega.js: espera as imagens
const W=960,H=540;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;

/* ---------- utilidades ---------- */
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeOut=p=>1-(1-p)*(1-p), easeIn=p=>p*p, lin=p=>p;
const tweens=[];
function tween(o,k,to,ms,ease){return new Promise(res=>{tweens.push({o,k,from:o[k],to,ms,t:0,ease:ease||lin,res});});}
function stepTweens(dt){for(let i=tweens.length-1;i>=0;i--){const w=tweens[i];w.t+=dt*1000;const p=Math.min(1,w.t/w.ms);w.o[w.k]=w.from+(w.to-w.from)*w.ease(p);if(p>=1){tweens.splice(i,1);w.res();}}}
const wait=ms=>tween({v:0},'v',1,ms);

let AC=null;
// sons gravados (assets/sfx/novos, CC0): interface, batalha e cinematicas. som(nome,vol): toca uma copia; o mesmo som
// nao repete em menos de 50 ms (cacos caindo juntos nao viram um estouro)
const SOM={},somUlt={};
for(const n of ['ui_mover','ui_ok','ui_voltar','ui_erro','ui_vez','ui_inicio','magia_gelo','carga_gelo','pocao','defender','recompensa','nivel',
  'inimigo_ataca','inimigo_morre','inimigo_rosna','fenrir_rosna','fenrir_latido','fenrir_ataque','fenrir_mordida','fenrir_uivo','presa_rosna','presa_uivo','presa_mordida','presa_investida','caco_pequeno','gelo_quebra','gelo_quebra2','whoosh','whoosh2','magia_brilho','magia_raio','pedras','neve_pancada','bolota_espirro','goblin_facada','goblin_moedas','goblin_pedrada','acolito_esfera','acolito_explode','acolito_drenar','acolito_vazio','skoll_mordida','skoll_correntes','bolotao_rosna','bolotao_bruf','bolotao_rolo','bolotao_avalanche','bolotao_abraco','bolotao_bola','capitao_rosna','capitao_bravata','capitao_risada','capitao_machado','capitao_clank','capitao_apito','lobo_rosna','lobo_ataque','lobo_mordida','lobo_uivo','lobo_latido','bino_whoosh','bino_golpe','bino_golpe_forte','bino_quebra','bino_rumble','bino_pedras','bino_pedra_forma','bino_muralha','bino_cura','bino_investida','bino_peito','bino_urso1','bino_urso2','bino_rugido','bino_rugido2','bino_rugido_longo','bino_rugido_queda']){
  const a=new Audio();a.preload='auto';a.src='assets/sfx/novos/'+n+(a.canPlayType('audio/ogg; codecs="vorbis"')?'.ogg':'.mp3')+(n.startsWith('bino_')?'?v=2':'');SOM[n]=a;}
function som(n,vol){const a=SOM[n],now=performance.now();if(!a||now-(somUlt[n]||0)<50)return;somUlt[n]=now;
  try{const c=a.cloneNode();c.volume=clamp(vol??.8,0,1);c.play().catch(()=>{});}catch(e){}}
function sfx(f,d,type,vol,slide){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),AC.currentTime+d);g.gain.setValueAtTime(vol||0.05,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.connect(g);g.connect(acSaida(AC));o.start();o.stop(AC.currentTime+d);}catch(e){}}

/* ---------- paleta ---------- */
const P={skin:'#e9b48f',skinS:'#c98c6b',hair:'#2a1a14',hairHi:'#4d3024',hairSide:'#5a4034',beard:'#4a3328',beardHi:'#6b4a3a',lip:'#b4705c',
 frame:'#0e0e16',lens:'#e4c3a8',glare:'#f4fbff',eye:'#22140e',tank:'#f5f7fb',tankS:'#c9d1e2',gold:'#f0c94c',goldHi:'#fff2a6',ink:'#1a2438',inkHi:'#3b5a82',
 pants:'#252d45',pantsHi:'#323c5c',boots:'#151827',belt:'#6b4a2a',cape:'#2f78dc',capeD:'#1a4388',ice:'#c4f7ff',iceM:'#7fd6f5',iceD:'#3a9ccf'};
function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h);}

/* ---------- espada de gelo (unidades da grade) ---------- */
function drawSword(c,ang,glow,t){
  c.save();c.rotate(ang);
  const blade=()=>{c.beginPath();c.moveTo(-1.7,-1.5);c.lineTo(-2.0,-10);c.lineTo(-1.5,-19);c.lineTo(0,-26);c.lineTo(1.5,-19);c.lineTo(2.0,-10);c.lineTo(1.7,-1.5);c.closePath();};
  // brilho
  c.save();c.shadowColor='#6fe3ff';c.shadowBlur=14+glow*30+Math.sin(t*5)*4;
  const g=c.createLinearGradient(-2,0,2,0);g.addColorStop(0,'#d9fbff');g.addColorStop(.5,'#ffffff');g.addColorStop(1,'#4fb4ea');
  c.fillStyle=g;blade();c.fill();c.restore();
  // cristais nas bordas
  c.fillStyle='#bff2ff';
  [[2,-7,3.8,-10.5,1.9,-11.5],[-2,-13,-3.8,-16,-1.8,-17],[1.6,-16,3.1,-19,1.4,-20],[-1.8,-6,-3.2,-8.5,-1.9,-9.5],[1.9,-2.5,3.4,-4.5,1.7,-5.5]]
   .forEach(p=>{c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(p[2],p[3]);c.lineTo(p[4],p[5]);c.closePath();c.fill();});
  // veio central
  c.strokeStyle='#6fd8ff';c.lineWidth=.35;c.beginPath();c.moveTo(0,-2);c.lineTo(0,-23);c.stroke();
  c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=.15;c.beginPath();c.moveTo(-.9,-3);c.lineTo(-.9,-18);c.stroke();
  // reflexo correndo pela lamina
  c.save();blade();c.clip();
  const sp=((t*0.7)%1.4)*28-26;const sh=c.createLinearGradient(0,-sp-6,0,-sp+6);
  sh.addColorStop(0,'rgba(255,255,255,0)');sh.addColorStop(.5,'rgba(255,255,255,.85)');sh.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=sh;c.fillRect(-3,-27,6,28);c.restore();
  // guarda de cristal
  const gg=c.createLinearGradient(0,-1.8,0,1);gg.addColorStop(0,'#e8fbff');gg.addColorStop(1,'#4a8fc4');
  c.fillStyle=gg;c.beginPath();c.moveTo(-5,-1.4);c.lineTo(-2,-2.1);c.lineTo(0,-1.2);c.lineTo(2,-2.1);c.lineTo(5,-1.4);c.lineTo(3,.9);c.lineTo(0,.2);c.lineTo(-3,.9);c.closePath();c.fill();
  c.fillStyle='#2a6fb0';c.fillRect(-.8,-1.4,1.6,1.4);
  c.fillStyle='#fff';c.fillRect(-.4,-1.2,.8,.7);
  // cabo e pomo
  R(c,-.7,.6,1.4,3.8,'#1d3358');R(c,-.7,1.4,1.4,.35,'#7fd6f5');R(c,-.7,2.6,1.4,.35,'#7fd6f5');
  c.fillStyle='#bff6ff';c.beginPath();c.moveTo(0,4.2);c.lineTo(1.1,5.4);c.lineTo(0,6.8);c.lineTo(-1.1,5.4);c.closePath();c.fill();
  const m=c.getTransform();const tip=m.transformPoint(new DOMPoint(0,-26));
  c.restore();
  return tip;
}

/* ---------- heroi: animacoes recortadas pelo laboratorio (tools/cut_lab.py -> sprites_anim.js) ---------- */
const A=window.JUX_ANIM;const ATLAS=new Image();ATLAS.src=A.atlas;
// magias (tools/cut_magias.py -> sprites_magias.js): quadros do heroi em outro atlas, mesma escala; efeitos desenhados no inimigo
const M=window.JUX_MAGIA;const ATLAS_M=new Image();ATLAS_M.src=M.heroi.atlas;const ATLAS_E=new Image();ATLAS_E.src=M.efeitos.atlas;
// Ressonancia (tools/cut_magias.py ressonancia -> sprites_ressonancia.js)
const RES=window.JUX_RES;const ATLAS_R=new Image();ATLAS_R.src=RES.heroi.atlas;const ATLAS_RE=new Image();ATLAS_RE.src=RES.efeitos.atlas;
// Danca Glacial (tools/cut_magias.py danca -> sprites_danca.js)
const DAN=window.JUX_DANCA;const ATLAS_D=new Image();ATLAS_D.src=DAN.heroi.atlas;const ATLAS_DE=new Image();ATLAS_DE.src=DAN.efeitos.atlas;
// Ressonancia II: Zero Absoluto (tools/cut_magias.py zero -> sprites_zero.js)
const ZER=window.JUX_ZERO;const ATLAS_Z=new Image();ATLAS_Z.src=ZER.heroi.atlas;const ATLAS_ZE=new Image();ATLAS_ZE.src=ZER.efeitos.atlas;
// Nevasca Eterna (tools/cut_magias.py nevasca -> sprites_nevasca.js)
const NEV=window.JUX_NEVASCA;const ATLAS_N=new Image();ATLAS_N.src=NEV.heroi.atlas;const ATLAS_NE=new Image();ATLAS_NE.src=NEV.efeitos.atlas;
// Lanca Boreal (tools/cut_magias.py lanca -> sprites_lanca.js)
const LAN=window.JUX_LANCA;const ATLAS_L=new Image();ATLAS_L.src=LAN.heroi.atlas;const ATLAS_LE=new Image();ATLAS_LE.src=LAN.efeitos.atlas;
// Escudo de Cristal (tools/cut_magias.py escudo -> sprites_escudo.js)
const ESC=window.JUX_ESCUDO;const ATLAS_S=new Image();ATLAS_S.src=ESC.heroi.atlas;const ATLAS_SE=new Image();ATLAS_SE.src=ESC.efeitos.atlas;
// folhas novas da batalha (tools/cut_batalha.py -> sprites_batalha.js): tem prioridade sobre as antigas de mesmo nome
const BAT=window.JUX_BAT;const ATLAS_B=new Image();if(BAT)ATLAS_B.src=BAT.atlas;
const BINO_D=window.JUX_BINO||null,ATLAS_BINO=new Image();if(BINO_D)ATLAS_BINO.src=BINO_D.atlas;   // folhas do Bino (tools/cut_bino.py)
/* ---------- Ecos em campo (PLANO_V2 Parte 3): a criatura do Eco equipado fica atras do Jux, como um espirito ---------- */
const ECS=window.JUX_ECOS;const ATLAS_EC=new Image();if(ECS)ATLAS_EC.src=ECS.atlas;
const CRIATURA_ECO={lamina:'fenrir'};   // Eco -> criatura (as outras entram uma por vez)
function ecoCampo(){if(!ECS||typeof estadoEcos!=='function')return null;const c=CRIATURA_ECO[estadoEcos().equip];return c&&ECS.anims[c+'_campo']?c:null;}
const posEco=()=>({x:JUX.x+190,y:JUX.y-58});   // atras do heroi (mais longe da camera) e um pouco acima
function drawEco(c,t){const cr=ecoCampo();if(!cr)return;const an=ECO.anim||cr+'_campo',A=ECS.anims[an]||ECS.anims[cr+'_campo'];
  let i=ECO.q!=null?ECO.q:Math.floor((ECO.anim?t-ECO.t0:t)*A.fps);i=A.loop?i%A.quadros.length:Math.min(i,A.quadros.length-1);const j=A.quadros[i];
  const p=posEco(),x=p.x+ECO.dx,y=p.y+ECO.dy,s=2*ECO.esc,flu=ECO.anim?-ECO.alt:Math.sin(t*1.6)*3;
  // sombra de luz no chao
  c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y+4,0,x,y+4,120*ECO.esc);g.addColorStop(0,'rgba(120,210,255,.35)');g.addColorStop(1,'rgba(120,210,255,0)');
  c.fillStyle=g;c.save();c.translate(x,y+4);c.scale(1,.22);c.translate(-x,-y-4);c.fillRect(x-120,y-116,240,240);c.restore();c.restore();
  c.save();c.translate(Math.round(x),Math.round(y+flu));c.scale(-s,s);   // a folha olha para a direita: espelha
  c.globalAlpha=ECO.alpha*(.9+.06*Math.sin(t*2.3));c.drawImage(ATLAS_EC,j*ECS.w,0,ECS.w,ECS.h,-ECS.ancora[0],-ECS.ancora[1],ECS.w,ECS.h);
  c.globalCompositeOperation='lighter';c.globalAlpha=ECO.alpha*(.16+.1*Math.sin(t*2.3));   // brilho de espirito pulsando
  c.drawImage(ATLAS_EC,j*ECS.w,0,ECS.w,ECS.h,-ECS.ancora[0]*1.04,-ECS.ancora[1]*1.04,ECS.w*1.04,ECS.h*1.04);c.restore();
  if(Math.random()<.12)parts.push({type:'luz',x:x+rnd(-90,90),y:y-rnd(10,170),vx:rnd(-10,10),vy:rnd(-60,-25),g:0,life:rnd(.8,1.6),age:0,sz:rnd(3,5),cor:'170,230,255'});}
const ECO={anim:null,q:null,t0:0,dx:0,dy:0,alt:0,alpha:1,esc:1};   // esc = tamanho (Ragnarok cresce)   // anim/q = folha e quadro do golpe; dx,dy = deslocamento; alt = altura do pulo
const ecoQ=(anim,q)=>{ECO.anim=anim;ECO.q=q;};
function ecoVolta(){ECO.anim=null;ECO.q=null;ECO.dx=0;ECO.dy=0;ECO.alt=0;ECO.alpha=1;ECO.esc=1;}
// Mordida Glacial (Fenrir, folha ref/ecos/fenrir_mordida.png): sai de tras do Jux, salta no inimigo, morde duas vezes,
// some em luz e reaparece no lugar dele
async function ecoMordida(H){const A='fenrir_mordida',p=posEco(),e=enemy,alvoDx=e.x+150-p.x,alvoDy=e.y-p.y;
  ecoPensa('Eu sigo você.',1500);hero.charge=.6;ecoQ(A,0);som('fenrir_rosna',.9);fxLinhas(p.x,p.y-60,420,{a:.35});fxBrilho(p.x-60,p.y-50,{raio:200,ms:400,cresce:true});await wait(320);
  // o bote: arco ate o inimigo, com rastro de luz
  ecoQ(A,1);som('fenrir_ataque',.9);som('whoosh',.6);fxCorte(p.x,p.y-60,e.x+150,e.y-70,{ms:460,esp:22,risca:.6});
  tween(ECO,'dx',alvoDx,300,easeIn);tween(ECO,'dy',alvoDy,300,easeIn);tween(ECO,'alt',90,150,easeOut).then(()=>tween(ECO,'alt',30,150,easeIn));
  await wait(160);ecoQ(A,2);await wait(150);
  // primeira mordida
  ecoQ(A,3);som('fenrir_mordida',1);fxImpacto(e.x,e.y-100);fxCorte(e.x+60,e.y-200,e.x+20,e.y-40,{ms:300,esp:20});fxCorte(e.x+10,e.y-190,e.x-30,e.y-30,{ms:300,esp:20});
  fxGolpe(e.x,e.y-110,1.2);hitEnemy(dmg(H.poder[0],.15),false);await wait(230);
  // gira no ar e morde de novo, mais forte
  ecoQ(A,4);tween(ECO,'alt',110,180,easeOut);await wait(190);
  ecoQ(A,5);som('fenrir_latido',.8);tween(ECO,'alt',10,120,easeIn);await wait(110);som('fenrir_mordida',1);
  fxImpacto(e.x,e.y-90);fxCorte(e.x+70,e.y-170,e.x-50,e.y-20,{ms:380,esp:30});fxGolpe(e.x,e.y-100,1.7);fxAnel(e.x,e.y+12,{raio:460,achata:.26,ms:600});
  fxFlash('180,230,255',.35,280);CAM.zoom=cam0().zoom*camK(1.18);fxZoomVolta(600);hitEnemy(dmg(H.poder[1]||H.poder[0],.15),true);await wait(260);
  // pousa derrapando e some em luz
  ecoQ(A,6);ECO.alt=0;tween(ECO,'dx',alvoDx+60,220,easeOut);await wait(260);
  fxBrilho(p.x+ECO.dx,p.y+ECO.dy-60,{raio:240,ms:500});fxFaiscas(p.x+ECO.dx,p.y+ECO.dy-60,22,{ang:-1.57,abre:1,vel:600,g:-100});await tween(ECO,'alpha',0,240);
  // reaparece atras do Jux
  ECO.dx=0;ECO.dy=0;ecoQ(A,7);fxBrilho(p.x,p.y-60,{raio:260,ms:500,cresce:true});fxAnel(p.x,p.y+4,{raio:260,achata:.28,ms:500});await tween(ECO,'alpha',1,260);
  hero.charge=0;await wait(250);ecoVolta();}
// Garra Perfurante (Fenrir, ref/ecos/fenrir_garra.png): garras crescem, dispara rente ao chao, empina e crava a garra
// (3 rasgos de luz, ignora metade da DEF), pula para tras, some em luz e volta
async function ecoGarra(H){const A='fenrir_garra',p=posEco(),e=enemy,alvoDx=e.x+150-p.x,alvoDy=e.y-p.y;
  ecoPensa('Nada escapa das minhas garras.',1900);hero.charge=.6;ecoQ(A,0);som('fenrir_rosna',.9);fxBrilho(p.x-110,p.y-10,{raio:180,ms:500,cresce:true});fxEstrela(p.x-110,p.y-10,{raio:220,ms:420});await wait(380);
  // dispara rente ao chao
  ecoQ(A,1);som('whoosh',.7);fxCorte(p.x,p.y-30,e.x+150,e.y-30,{ms:380,esp:16,risca:.6});fxFaiscas(p.x,p.y-20,12,{ang:0,abre:.3,vel:700,g:0});
  tween(ECO,'dy',alvoDy,240,easeIn);await tween(ECO,'dx',alvoDx,240,easeIn);
  // empina
  ecoQ(A,2);som('fenrir_ataque',1);fxLinhas(e.x,e.y-110,320,{a:.45});await wait(260);
  // a garrada: tres rasgos de luz de cima para baixo
  ecoQ(A,3);som('fenrir_mordida',.8);fxImpacto(e.x,e.y-110);
  for(let k=0;k<3;k++)fxCorte(e.x+110-k*36,e.y-260+k*8,e.x-40-k*36,e.y+10+k*8,{ms:460,esp:22});

// soma EXP, sobe quantos niveis der e devolve o que mudou (para a tela de vitoria)
function ganhaExp(x){const r={exp:x,de:prog.nivel,novas:[]};prog.exp+=x;
  while(prog.nivel<NIVEL_MAX&&prog.exp>=expPara(prog.nivel)){prog.exp-=expPara(prog.nivel);prog.nivel++;for(const h of HABILIDADES)if(h.nivel===prog.nivel)r.novas.push(h);}

// o: escala (padrao 2), flip (espelha), de:[x,y] (vem desse ponto ate x,y em 'mover' ms, acelerando)
const efx=[],FXSRC={};
for(const [D,img] of [[M.efeitos,ATLAS_E],[RES.efeitos,ATLAS_RE],[DAN.efeitos,ATLAS_DE],[ESC.efeitos,ATLAS_SE],[LAN.efeitos,ATLAS_LE],[NEV.efeitos,ATLAS_NE],[ZER.efeitos,ATLAS_ZE]])for(const n in D.anims)FXSRC[n]={D,img};

function playFx(name,x,y,ms,o){efx.push({name,x,y,t:0,ms,o:o||{}});}
function drawEfx(c,dt){
  for(let i=efx.length-1;i>=0;i--){const e=efx[i];e.t+=dt;if(e.t*1000>e.ms){efx.splice(i,1);continue;}
    const {D,img}=FXSRC[e.name],an=D.anims[e.name];let k=Math.floor(e.t*an.fps);k=an.loop?k%an.quadros.length:Math.min(k,an.quadros.length-1);
    const s=e.o.escala||2,left=e.ms/1000-e.t;let x=e.x,y=e.y;
    if(e.o.de){const q=easeIn(Math.min(1,e.t*1000/(e.o.mover||e.ms)));x=e.o.de[0]+(e.x-e.o.de[0])*q;y=e.o.de[1]+(e.y-e.o.de[1])*q;}
    c.save();c.globalAlpha=clamp(Math.min(e.t/.08,left/.18),0,1)*(e.o.alpha??1);   // alpha: ver atraves (inimigo dentro do pilar)
    c.translate(Math.round(x),Math.round(y));if(e.o.flip)c.scale(-1,1);
    c.drawImage(img,an.quadros[k]*D.w,0,D.w,D.h,-D.ancora[0]*s,-(D.ancora[1]+1)*s,D.w*s,D.h*s);
    if(!e.o.semBrilho){const b=s*1.07;c.globalCompositeOperation='lighter';c.globalAlpha*=.32;   // brilho: o efeito somado um pouco maior por cima
      c.drawImage(img,an.quadros[k]*D.w,0,D.w,D.h,-D.ancora[0]*b,-(D.ancora[1]+1)*b,D.w*b,D.h*b);}
    c.restore();}}

function pecaNova(name){const S=FXSRC[name];if(!S||!S.D.caixas)return null;const q=S.D.anims[name].quadros[0],cx=S.D.caixas[q];return{img:S.img,sx:q*S.D.w+cx[0],sy:cx[1],sw:cx[2],sh:cx[3]};}

  if(enemy.hp<=0){await mortes();if(!inimigos().length)return win();return fim();}

  const si=(()=>{let exp=0,gil=0;for(const e of ENEMIES){const a=inimigoNv(e.nv||prog.nivel),T=TIPOS_INIMIGO[e.tipo]||{};
    // EXP (PLANO_PROGRESSAO.md): lutas por nivel F(L)=9*L^0,3 (2 inimigos em media) => nivel 10 em ~4 h, nivel 50 em ~32 h e nivel 100 em ~80 h de jogo; inimigo mais forte que voce paga um pouco mais, mais fraco paga bem menos
    const L=prog.nivel,base=expPara(L)/(9*Math.pow(L,.3))/2.2,dif=Math.max(.25,Math.min(1.5,1+((e.nv||L)-L)*.12));
    exp+=base*((T.exp||.4)/.4)*dif*(e.elite?3:1)*(G.encontro&&G.encontro.regiao==='vale'?1.3:1)*(e.chefe?(G.encontro.chefe.exp||5):1);gil+=a.gil*(T.gil||1)*(e.elite?3:1)*(e.chefe?(G.encontro.chefe.exp||5):1);}return {exp:Math.round(exp),gil:Math.round(gil)};})(),k=1;const drops=typeof sorteiaDrops==='function'?sorteiaDrops(ENEMIES.map(e=>e.tipo||'ignarok'),stats(prog.nivel).sor):[];
  if(!TESTE&&typeof daItem==='function')for(const d of drops)daItem(d.id,d.n);
  G.recompensa={...ganhaExp(si.exp*k),gil:si.gil*k,drops,eco:(!TESTE&&typeof ganhaPE==='function')?ganhaPE(Math.max(3,Math.round(si.exp*k/25))):null};if(!TESTE&&typeof JOGO==='object'){JOGO.gil+=si.gil*k;JOGO.vitorias=(JOGO.vitorias||0)+1;{const bs=JOGO.besta=JOGO.besta||{};for(const e of ENEMIES)if(e.tipo)bs[e.tipo]=(bs[e.tipo]||0)+1;}if(JOGO.cap1)JOGO.cap1.lobos=(JOGO.cap1.lobos||0)+ENEMIES.filter(e=>e.tipo==='lobo').length;if(G.encontro&&G.encontro.prova){if(G.encontro.prova.startsWith('chefe_')){(JOGO.chefes=JOGO.chefes||{})[G.encontro.prova.slice(6)]=true;JOGO.chefePend=G.encontro.prova.slice(6);}else (JOGO.provas=JOGO.provas||{})[G.encontro.prova]='vencida';}if(JOGO.buff){JOGO.buff.lutas--;if(JOGO.buff.lutas<=0)JOGO.buff=null;}salvaJogo();}
  if(temBino())G.recompensa.bino=ganhaExpBino(si.exp);
  if(!TESTE&&typeof guardaVida==='function'){   // HP/MP continuam para a proxima luta; quem subiu de nivel enche
    if(G.recompensa.para>G.recompensa.de)encheVida('jux');else guardaVida('jux',Math.max(1,JUX.hp),JUX.mp);
    if(temBino()){const rb=G.recompensa.bino;if(rb&&rb.para>rb.de)encheVida('bino');else guardaVida('bino',Math.max(1,BINO.hp),BINO.mp);}
    salvaJogo();}
  som('recompensa',.7);if(G.recompensa.para>G.recompensa.de)setTimeout(()=>som('nivel',.85),500);
  G.scene='win';G.t0=G.t;G.busy=false;}

  G.busy=true;menu.open=false;banner('Fugiu!');som('whoosh',.7);musicaSome(900);

  if(!TESTE&&typeof guardaVida==='function'){guardaVida('jux',Math.max(1,JUX.hp),JUX.mp);if(temBino())guardaVida('bino',Math.max(1,BINO.hp),BINO.mp);salvaJogo();}
  await wait(1000);try{localStorage.setItem('jux_volta_luta',JSON.stringify({res:'fuga',t:Date.now()}));}catch(e){}

function magicEnabled(i){if(hero.quem==='bino')return binoHabEnabled(i);const h=magicList()[i];if(h.id!=='voltar'&&temEst(hero,'silencio')&&!(h.eco&&HABS[h.hab].t==='f'))return false;return h.id==='voltar'||(h.feito&&h.nivel<=prog.nivel&&hero.mp>=h.mp);}
// com o Zero Absoluto (nivel 30) o comando Ressonancia abre a escolha entre as duas
const resList=()=>[...(habLigada('res')?[{id:'res',nome:'Rei do Inverno (um alvo)'}]:[]),...(habLigada('zero')?[{id:'zero',nome:'Zero Absoluto (todos)'}]:[]),...(liberada('res3')&&habLigada('res3')?[{id:'res3',nome:'Coroa Boreal (todos)'}]:[]),...(liberada('final')&&habLigada('final')?[{id:'final',nome:'Era do Gelo (todos)'}]:[]),{id:'voltar',nome:'Voltar'}];

// escolher alvo: com 1 inimigo vivo nao pergunta; com mais, o menu vira a lista dos vivos (setas ou clique no inimigo)
function pedeAlvo(kind,volta,vidx){const vivos=inimigos();
  if(vivos.length<=1){enemy=vivos[0]||enemy;heroTurn(kind);return;}
  menu.level='alvo';menu.acao=kind;menu.volta=[volta,vidx];menu.idx=Math.max(0,vivos.indexOf(enemy));menu.top=0;}
// o menu mostra 5 linhas; com mais itens ele rola acompanhando o cursor
const VIS=6;   // 6 linhas: cabe o Fugir no menu principal sem rolar
function fixTop(){menu.top=menu.top||0;if(menu.idx<menu.top)menu.top=menu.idx;if(menu.idx>=menu.top+VIS)menu.top=menu.idx-VIS+1;}
function choose(i){
  if(G.busy||!menu.open)return;
  if(hero.quem==='bino'&&(menu.level==='main'||menu.level==='magic'))return chooseBino(i);
  if(menu.level==='alvo'){const e=inimigos()[i];if(!e)return;som('ui_ok',.6);enemy=e;heroTurn(menu.acao);return;}
  if(menu.level==='res'){const r=resList()[i];som('ui_ok',.6);
    if(r.id==='voltar'){menu.level='main';menu.idx=4;menu.top=0;}else if(r.id==='zero'||r.id==='res3'||r.id==='final')heroTurn(r.id);else pedeAlvo('res','res',0);return;}
  if(menu.level==='item'){const it=itemList()[i];if(!it)return;
    if(it.id==='voltar'){menu.level='main';menu.idx=2;menu.top=0;som('ui_voltar',.6);return;}
    if(!itemEnabled(i)){som('ui_erro',.6);banner(it.id==='fenix'?'Nenhum aliado caído':'MP já está cheio');return;}
    som('ui_ok',.6);heroTurn('item_'+it.id);return;}
  if(menu.level==='main'){
    if(!mainEnabled(i)){som('ui_erro',.6);return;}
    som('ui_ok',.6);
    if(i===0)pedeAlvo('attack','main',0);else if(i===1){menu.level='magic';menu.idx=0;menu.top=0;}
    else if(i===2){menu.level='item';menu.idx=0;menu.top=0;}else if(i===3)heroTurn('guard');
    else if(i===5)fugir();
    else if(liberada('zero')){menu.level='res';menu.idx=0;menu.top=0;}else pedeAlvo('res','main',4);
  }else{
    const h=magicList()[i];
    if(h.id==='voltar'){menu.level='main';menu.idx=1;menu.top=0;som('ui_voltar',.6);return;}
    if(h.nivel>prog.nivel){som('ui_erro',.6);banner(h.nome+' libera no nível '+h.nivel);return;}
    if(!h.feito){som('ui_erro',.6);banner(h.nome+': em breve');return;}
    if(!magicEnabled(i)){som('ui_erro',.6);return;}
    som('ui_ok',.6);
    if(h.eco){if(HABS[h.hab].alvo==='eu'||HABS[h.hab].alvo==='todos')heroTurn(h.id);else pedeAlvo(h.id,'magic',i);}
    else if(h.id==='nevasca'||h.id==='escudo'||h.id==='espelho'||h.id==='estalactites'||h.id==='coracao'||h.id==='aurora_b')heroTurn(h.id);   // campo inteiro / no proprio heroi: sem alvo
    else pedeAlvo(h.id,'magic',i);
  }
}

/* ---------- interface ---------- */
function win_(c,x,y,w,h){const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#1c34a8');g.addColorStop(1,'#0a1048');c.fillStyle=g;c.beginPath();c.roundRect(x,y,w,h,8);c.fill();c.lineWidth=3;c.strokeStyle='#e8f1ff';c.stroke();c.lineWidth=1;c.strokeStyle='#5f7ad8';c.beginPath();c.roundRect(x+4,y+4,w-8,h-8,6);c.stroke();}
function txt(c,s,x,y,size,col,al){c.font=`bold ${size}px "Trebuchet MS"`;c.textAlign=al||'left';c.lineWidth=4;c.strokeStyle='rgba(0,0,20,.85)';c.strokeText(s,x,y);c.fillStyle=col||'#fff';c.fillText(s,x,y);}
// texto que diminui a letra ate caber na largura w (tela de vitoria: nada passa do quadro)
function txtCabe(c,s,x,y,size,col,w,al){let z=size;c.font=`bold ${z}px "Trebuchet MS"`;while(z>11&&c.measureText(s).width>w){z--;c.font=`bold ${z}px "Trebuchet MS"`;}txt(c,s,x,y,z,col,al);}
function bar(c,x,y,w,h,p,col1,col2){c.fillStyle='#0a0f2a';c.fillRect(x,y,w,h);const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,col1);g.addColorStop(1,col2);c.fillStyle=g;c.fillRect(x+1,y+1,Math.max(0,(w-2)*clamp(p,0,1)),h-2);c.strokeStyle='#cfd8ff';c.lineWidth=1;c.strokeRect(x+.5,y+.5,w-1,h-1);}

// painel escuro translucido com borda azul (estilo da referencia)
function painel(c,x,y,w,h){c.fillStyle='rgba(8,16,44,.84)';c.beginPath();c.roundRect(x,y,w,h,6);c.fill();c.lineWidth=2;c.strokeStyle='#6fc8ee';c.stroke();
  c.lineWidth=1;c.strokeStyle='rgba(160,220,255,.35)';c.beginPath();c.roundRect(x+3,y+3,w-6,h-6,4);c.stroke();}
// cartao de um aliado (embaixo a direita): nome, nivel, HP, MP, ATB e Ressonancia
function cartao(c,x,y,o){painel(c,x,y,172,66);
  txt(c,o.nome,x+10,y+19,15,'#fff');if(o.nv)txt(c,'Nv '+o.nv,x+162,y+19,12,'#ffe27a','right');
  txt(c,'HP',x+10,y+36,11,'#ffd9a0');txt(c,String(o.hp),x+162,y+36,15,o.hp<o.max*.25?'#ff8a8a':'#fff','right');bar(c,x+30,y+28,82,6,o.hp/o.max,'#7dffa8','#1f9f56');
  txt(c,'MP',x+10,y+50,11,'#9cc7ff');txt(c,String(o.mp),x+162,y+50,13,'#fff','right');bar(c,x+30,y+43,82,5,o.mp/o.mmax,'#7fd6f5','#2a7ac4');
  bar(c,x+10,y+56,152,4,o.atb,o.atb>=1?'#fff7a8':'#ffe27a','#c88a00');
  if(o.res!=null){const full=o.res>=100;bar(c,x+10,y+61,152,3,o.res/100,full?'#fff3a0':'#bff6ff',full?'#ffb400':'#3a9ccf');}
  if(o.tag)txt(c,o.tag,x+162,y+64,10,'#9cc7ff','right');}
function drawHUD(c,t){
  // cartoes dos aliados (ate 4), embaixo a direita
  const cs=[{nome:'Jux',nv:prog.nivel,hp:JUX.hp,max:JUX.max,mp:JUX.mp,mmax:JUX.mmax,atb:JUX.atb,res:liberada('res')?JUX.res:null,tag:[JUX.escudo>0?'ESCUDO '+JUX.escudo:JUX.guard?'GUARDA':'',...Object.keys(JUX.est||{}).map(k=>ESTADOS[k]?ESTADOS[k].nome:k)].filter(Boolean).join(' · ')}];
  if(temBino())cs.push({nome:'Bino',nv:nvBino(),hp:BINO.hp,max:BINO.max,mp:BINO.mp,mmax:BINO.mmax,atb:BINO.atb,tag:[BINO.guard?'GUARDA':'',...Object.keys(BINO.est||{}).filter(k=>BINO.est[k]>0).map(k=>(ESTADOS[k]?ESTADOS[k].nome:k)+(k==='furia'?' '+BINO.est[k]:''))].filter(Boolean).join(' · ')});
  if(G.campoCheio)['Aliado 2','Aliado 3','Aliado 4'].forEach(n=>cs.push({nome:n,hp:999,max:999,mp:99,mmax:99,atb:.5}));

    const il=menu.level==='item'?itemList():null;

    painel(c,630,64,320,18+Math.min(VIS,list.length)*28);
    if(menu.level==='alvo')txt(c,'Escolha o alvo  (Esc volta)',640,58,13,'#ffe27a');else if(hero.quem==='bino')txt(c,'Vez do Bino',640,58,13,'#ffb27a');
    if(menu.top>0)txt(c,'\u25B2',930,80,11,'#a9bdf5','center');if(menu.top+VIS<list.length)txt(c,'\u25BC',930,74+VIS*28,11,'#a9bdf5','center');
    list.forEach((n,i)=>{if(i<menu.top||i>=menu.top+VIS)return;const r=menuRow(i);let en=menu.level==='main'?mainEnabled(i):il?itemEnabled(i):magicEnabled(i);
      let size=17;if(menu.level==='alvo'||menu.level==='res')en=true;
      if(menu.level==='main'&&i===4&&!liberada('res'))n='Ressonância  Nv '+nivelDe('res');
      if(ml){const h=ml[i];if(h.id!=='voltar'){if(h.nivel>nvAtor()){n=h.nome+'  Nv '+h.nivel;size=14;}else if(!h.feito){n=h.nome+' (em breve)';size=13;}else n+='   '+h.mp;}}
      if(i===menu.idx){c.fillStyle='rgba(111,200,238,.22)';c.fillRect(r.x-4,r.y+2,r.w-8,r.h-3);}
      const col=!en?'#6f7aa8':(i===4&&menu.level==='main'?'#ffe27a':menu.level==='alvo'?'#ffd0a0':'#fff');
      txt(c,n,r.x+26,r.y+20,size,col);

// etiqueta sobre cada inimigo (tela): letra, nome, vida e estado
function etiquetas(c,t){
  const escolhendo=menu.open&&menu.level==='alvo',vivos=inimigos();
  const marcado=escolhendo?vivos[menu.idx]:(TESTE&&vivos.length>1?enemy:null);
  for(const e of ENEMIES){if(e.dead||e.morrendo)continue;const [x,y]=w2s(e.x,e.y+18);
    const est=[e.nevasca>0?'Nevasca '+e.nevasca:null,...Object.keys(e.est||{}).map(k=>ESTADOS[k]?ESTADOS[k].nome:k)].filter(Boolean).join(' · ');
    c.fillStyle=e===marcado?'#ffb400':'#c4300c';c.beginPath();c.arc(x-48,y+3,7,0,7);c.fill();txt(c,e.letra,x-48,y+7,10,'#fff','center');

}

  // troca de tomada: guarda o ultimo quadro da anterior para a transicao (s.entra)
  if(cine.tom!==i){cine.tom=i;cine.trans=null;
    if(s.entra&&cine.buf){const sn=document.createElement('canvas');sn.width=W;sn.height=H;sn.getContext('2d').drawImage(cine.buf,0,0);
      cine.trans={tipo:s.entra,snap:sn,cacos:s.entra==='racha'?cacosDaTela():null};
      if(s.entra==='racha')SONS.cacos();else{som('whoosh2',.7);ruido(.25,900,3800,.2);}}}
  const tr=cine.trans,pc=tr&&tr.tipo==='chicote'?easeOut(clamp(t/.22,0,1)):1;
  c.save();c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.beginPath();c.rect(0,BARRA,W,AH);c.clip();c.imageSmoothingEnabled=true;
  if(pc<1)c.translate(Math.round(W*(1-pc)),0);   // chicote: a tomada nova entra pela direitac.imageSmoothingQuality='high';   // cenas ja vem ampliadas (cut_cine): suaviza a reducao
  const cz=s.cinza?s.cinza[0]+(s.cinza[1]-s.cinza[0])*e:0,fl=[];
  if(cz>0)fl.push(`grayscale(${cz}) brightness(${1-cz*.12})`);if(s.pisca)fl.push(`brightness(${1+.35*Math.max(0,Math.sin(cine.t*40))})`);
  if(fl.length)c.filter=fl.join(' ');
  if(vel){const g=c.createLinearGradient(0,BARRA,0,BARRA+AH);g.addColorStop(0,'#0b1626');g.addColorStop(.5,'#1d3550');g.addColorStop(1,'#0b1626');
    c.fillStyle=g;c.fillRect(0,BARRA,W,AH);c.fillStyle='rgba(200,240,255,.55)';
    for(let n=0;n<40;n++){const ly=BARRA+((n*97)%AH),x=W-((cine.t*2400+n*263)%(W+400));c.fillRect(x,ly,180+(n%5)*60,n%3?1:3);}}
  else c.drawImage(im,Math.round(ox),Math.round(oy),Math.round(dw),Math.round(dh));
  c.filter='none';
  cineFx(c,s,i,p,dt,ox,oy,dw,dh,im,info);
  // o Jux recortado passa na frente da cena, mais rapido que o fundo (profundidade)
  if(s.jux){const j=s.jux,ji=CIMG[j.img],jn=CIN.recortes[j.img],x=j.de[0]+(j.ate[0]-j.de[0])*e,y=j.de[1]+(j.ate[1]-j.de[1])*e,sc=(j.de[2]+(j.ate[2]-j.de[2])*e)*AH/jn.h;
    if(j.rastro)for(let n=0;n<4;n++)cine.p.push({x:x*W+rnd(-20,10),y:BARRA+y*AH+rnd(-jn.h*sc*.4,jn.h*sc*.4),vx:rnd(-260,-120),vy:rnd(-20,20),v:0,max:rnd(.3,.6),s:rnd(2,5)});
    c.drawImage(ji,Math.round(x*W-jn.w*sc/2),Math.round(BARRA+y*AH-jn.h*sc/2),Math.round(jn.w*sc),Math.round(jn.h*sc));

    c.fillStyle='#f2fbff';for(const f of cine.flocos){f.y+=f.v*dt;f.x+=Math.sin(f.y*.03)*.5;c.fillRect(f.x,f.y,f.s,f.s);}}

    c.fillStyle='#d9fbff';for(const q of cine.cacos){q.x+=q.vx*dt;q.y+=q.vy*dt;q.s*=1+dt*1.6;c.save();c.translate(q.x,q.y);c.rotate(q.r+=dt*4);c.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);c.restore();}}
  // clarao branco no comeco da tomada

  const tot=C.tomadas.reduce((a,b)=>a+b.d,0);if(cine.t>tot-.25){c.fillStyle=`rgba(0,0,0,${(cine.t-(tot-.25))/.25})`;c.fillRect(0,0,W,H);}
  c.restore();

  if(!cine.buf){cine.buf=document.createElement('canvas');cine.buf.width=W;cine.buf.height=H;}
  cine.buf.getContext('2d').drawImage(c.canvas,0,0);
  if(tr)desenhaTransicao(c,tr,t,AH);
  // nome do golpe entrando no comeco, e o aviso de pular
  if(cine.t<2.2){const a=clamp(Math.min(cine.t/.3,(2.2-cine.t)/.4),0,1),dx=(1-Math.min(1,cine.t/.3))*-60;c.globalAlpha=a;
    txt(c,C.nome,28+dx,H-BARRA-46,16,'#bff6ff');c.save();c.shadowColor='#6fe3ff';c.shadowBlur=18;txt(c,C.sub,28+dx,H-BARRA-16,34,'#fff');c.restore();c.globalAlpha=1;}
  if(cine.leg)desenhaLegenda(c,cine.leg,cine.t-cine.leg.t0);
  txt(c,'ENTER pula',W-16,BARRA-18,13,'rgba(220,235,255,.7)','right');
}
// transicoes entre tomadas. chicote: o quadro velho sai pela esquerda borrado, com riscos de vento.
// racha: o quadro velho racha em cacos de vidro que voam e caem revelando a tomada nova
function cacosDaTela(){const NX=6,NY=4,P=[];
  for(let y=0;y<=NY;y++)for(let x=0;x<=NX;x++){const borda=x===0||y===0||x===NX||y===NY;
    P.push([x/NX*W+(borda?0:rnd(-40,40)),BARRA+y/NY*(H-2*BARRA)+(borda?0:rnd(-22,22))]);}
  const out=[],id=(x,y)=>y*(NX+1)+x;
  for(let y=0;y<NY;y++)for(let x=0;x<NX;x++){const a=P[id(x,y)],b=P[id(x+1,y)],c=P[id(x+1,y+1)],d=P[id(x,y+1)];
    for(const tri of (Math.random()<.5?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]])){const cx=(tri[0][0]+tri[1][0]+tri[2][0])/3,cy=(tri[0][1]+tri[1][1]+tri[2][1])/3,
      ang=Math.atan2(cy-H/2,cx-W/2),v=rnd(250,620);
      out.push({tri,cx,cy,vx:Math.cos(ang)*v,vy:Math.sin(ang)*v*.7-rnd(60,160),vr:rnd(-5,5),atraso:Math.hypot(cx-W/2,cy-H/2)/W*.12});}}
  return out;}
function desenhaTransicao(c,tr,t,AH){
  c.save();c.beginPath();c.rect(0,BARRA,W,AH);c.clip();
  if(tr.tipo==='chicote'&&t<.22){const q=easeOut(t/.22),x=-W*q;
    for(let k=3;k>=0;k--){c.globalAlpha=k?.18:1;c.drawImage(tr.snap,x+k*34,0);}
    c.globalAlpha=.5;c.fillStyle='#eafcff';for(let n=0;n<18;n++)c.fillRect(rnd(0,W),BARRA+rnd(0,AH),rnd(80,260),n%4?1:3);}
  if(tr.tipo==='racha'&&t<.6){
    if(t<.07){c.drawImage(tr.snap,0,0);c.strokeStyle='rgba(235,252,255,.9)';c.lineWidth=2;
      for(const q of tr.cacos){c.beginPath();c.moveTo(...q.tri[0]);c.lineTo(...q.tri[1]);c.lineTo(...q.tri[2]);c.closePath();c.stroke();}}
    else for(const q of tr.cacos){const tt=Math.max(0,t-.07-q.atraso);
      c.save();c.globalAlpha=clamp(1-tt/.5,0,1);c.translate(q.cx+q.vx*tt,q.cy+q.vy*tt+500*tt*tt);c.rotate(q.vr*tt);c.translate(-q.cx,-q.cy);
      c.beginPath();c.moveTo(...q.tri[0]);c.lineTo(...q.tri[1]);c.lineTo(...q.tri[2]);c.closePath();c.save();c.clip();c.drawImage(tr.snap,0,0);c.restore();
      c.strokeStyle='rgba(220,250,255,.8)';c.lineWidth=1.5;c.stroke();c.restore();}}
  c.restore();}
// legenda da fala: o nome do golpe em japones entra letra por letra (cada uma cai grande e assenta com brilho), uma faixa
// de luz corre por tras e a traducao aparece embaixo. Dura ~1,6 s
function desenhaLegenda(c,L,t){
  const DUR=1.6;if(t>DUR)return;
  const a=clamp(Math.min(t/.12,(DUR-t)/.3),0,1),cx=W/2,cy=H-BARRA-62,letras=[...L.jp],tam=50,esp=tam*1.02,x0=cx-(letras.length-1)*esp/2;
  c.save();c.globalAlpha=a;
  // faixa escura atras, com uma luz correndo
  const fw=letras.length*esp+170,g=c.createLinearGradient(cx-fw/2,0,cx+fw/2,0);
  g.addColorStop(0,'rgba(5,20,40,0)');g.addColorStop(.2,'rgba(5,20,40,.72)');g.addColorStop(.8,'rgba(5,20,40,.72)');g.addColorStop(1,'rgba(5,20,40,0)');
  c.fillStyle=g;c.fillRect(cx-fw/2,cy-46,fw,84);
  c.fillStyle='rgba(150,230,255,.9)';c.fillRect(cx-fw/2+30,cy-46,fw-60,1.5);c.fillRect(cx-fw/2+30,cy+37,fw-60,1.5);
  const lx=cx-fw/2+((t*1.4)%1)*fw,lg=c.createLinearGradient(lx-60,0,lx+60,0);
  lg.addColorStop(0,'rgba(180,240,255,0)');lg.addColorStop(.5,'rgba(200,245,255,.35)');lg.addColorStop(1,'rgba(180,240,255,0)');
  c.fillStyle=lg;c.fillRect(lx-60,cy-46,120,84);
  // letras: cada uma entra .07 s depois da anterior
  c.textAlign='center';c.textBaseline='middle';
  letras.forEach((ch,k)=>{const tk=t-k*.07;if(tk<0)return;const q=Math.min(1,tk/.14),sc=1+(1-q)*1.4;
    c.save();c.translate(x0+k*esp,cy-6);c.scale(sc,sc);c.globalAlpha=a*q;
    c.font='900 '+tam+'px "Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP",sans-serif';
    c.shadowColor='#5fd8ff';c.shadowBlur=22;c.lineWidth=6;c.strokeStyle='#0a2a4a';c.strokeText(ch,0,0);
    c.fillStyle=q<1?'#ffffff':'#eafcff';c.fillText(ch,0,0);c.shadowBlur=0;
    if(q<1){c.globalAlpha=a*(1-q);c.fillStyle='#fff';c.fillText(ch,0,0);}c.restore();});
  // traducao
  const tp=clamp((t-.35)/.25,0,1);
  if(tp>0){c.globalAlpha=a*tp;c.font='italic bold 19px "Trebuchet MS",sans-serif';c.fillStyle='#bff0ff';c.shadowColor='#000';c.shadowBlur=6;
    c.fillText('— '+L.pt+' —',cx,cy+26+(1-tp)*8);}
  c.restore();
}


/* ---------- MODO AUTOMÁTICO e velocidade 2× (SISTEMA_RPG.md §7b) ----------
   AUTO: o Jux escolhe sozinho. Cura quando a vida está baixa, usa a Ressonância com a barra cheia, magia no
   elemento fraco do inimigo quando tem MP, senão ataca. Estilos: Ofensivo, Equilibrado, Seguro. Teclas: Q = AUTO, V = velocidade */
const AUTO_ESTILOS=[null,'equilibrado','ofensivo','seguro'];
const AUTO_NOME={equilibrado:'Equilibrado',ofensivo:'Ofensivo',seguro:'Seguro'};
const AUTO_CFG={ofensivo:{cura:.25,reservaMP:0,neutro:.3,buff:'furia'},equilibrado:{cura:.38,reservaMP:.2,neutro:.6,buff:'regen'},seguro:{cura:.55,reservaMP:.35,neutro:2,buff:'muralha'}};
const POT_MAGIA={blade:80,storm:95,danca:120,lanca:140,nevasca:110,estalactites:150,kelvin:260};   // força aproximada das magias do Jux (para comparar)
const AREA={nevasca:1,estalactites:1};
try{G.auto=localStorage.getItem('jux_auto')||null;if(!AUTO_ESTILOS.includes(G.auto))G.auto=null;G.vel=(!!window.LAB_FIXO||location.hash==='#teste'||new URLSearchParams(location.search).has('teste'))?1:(localStorage.getItem('jux_vel')==='2'?2:1);}catch(e){}   // o laboratorio sempre abre em 1x (o 2x do jogo nao vaza para la)
function trocaAuto(){const i=AUTO_ESTILOS.indexOf(G.auto);G.auto=AUTO_ESTILOS[(i+1)%AUTO_ESTILOS.length];try{localStorage.setItem('jux_auto',G.auto||'');}catch(e){}
  som('ui_ok',.5);banner(G.auto?'AUTO: '+AUTO_NOME[G.auto]:'AUTO desligado');}
function trocaVel(){G.vel=G.vel===2?1:2;try{localStorage.setItem('jux_vel',G.vel===2?'2':'1');}catch(e){}som('ui_ok',.5);banner('Velocidade '+G.vel+'×');}
// escolhe a ação: devolve {kind, alvo}
function autoEscolhe(){const C=AUTO_CFG[G.auto]||AUTO_CFG.equilibrado,vivos=inimigos(),hp=hero.hp/hero.max,mp=hero.mp/Math.max(1,hero.mmax);
  const ml=magicList(),pode=id=>{const i=ml.findIndex(h=>h.id===id);return i>=0&&magicEnabled(i);};
  const il=itemList(),temItem=id=>il.some((o,i)=>o.id===id&&itemEnabled(i));
  // alvo: quebrado primeiro, depois o mais fraco
  const alvo=vivos.slice().sort((a,b)=>((b.quebrado>0)-(a.quebrado>0))||(a.hp-b.hp))[0];
  // 1) vida baixa: Cura do Eco, senão poção
  if(hp<C.cura){if(pode('coracao'))return {kind:'coracao'};if(pode('hab_cura'))return {kind:'hab_cura'};
    const p=hp<.3&&temItem('hipocao')?'hipocao':temItem('pocao')?'pocao':temItem('hipocao')?'hipocao':null;if(p)return {kind:'item_'+p};}
  // 2) estados ruins que atrapalham (seguro e equilibrado)
  if(G.auto!=='ofensivo'&&['silencio','cego','veneno','atordoado'].some(k=>temEst(hero,k))){if(pode('hab_esuna'))return {kind:'hab_esuna'};
    for(const [k,it] of [['silencio','ecoervas'],['cego','colirio'],['veneno','antidoto']])if(temEst(hero,k)&&temItem(it))return {kind:'item_'+it};}
  // 3) Ressonância cheia
  if(mainEnabled(4)){if(liberada('final')&&habLigada('final'))return {kind:'final'};if(liberada('res3')&&habLigada('res3')&&vivos.length>1)return {kind:'res3'};if(liberada('zero')&&habLigada('zero')&&vivos.length>1)return {kind:'zero'};if(habLigada('res'))return {kind:'res',alvo};}
  // 4) MP baixo (seguro/equilibrado): Éter
  if(mp<.15&&G.auto!=='ofensivo'&&temItem('eter'))return {kind:'item_eter'};
  // 5) reforço no começo (uma vez por luta)
  if(!G.autoBuff&&G.auto!=='seguro'&&pode('aurora_b')&&!temEst(hero,'aurora')){G.autoBuff=true;return {kind:'aurora_b'};}
  if(!G.autoBuff&&pode('hab_'+C.buff)){G.autoBuff=true;return {kind:'hab_'+C.buff};}
  if(G.auto==='seguro'&&hp<.7&&hero.escudo<=0&&pode('escudo'))return {kind:'escudo'};
  // 6) melhor golpe: magia/habilidade no elemento fraco, nunca no que o inimigo absorve
  let melhor=null,nota=0;const sobra=hero.mmax*C.reservaMP;
  for(let i=0;i<ml.length;i++){const h=ml[i];if(h.id==='voltar'||!magicEnabled(i)||hero.mp-(h.mp||0)<sobra&&!(h.mp===0))continue;
    let pot,g;if(h.eco){const H=HABS[h.hab];if(!H.poder)continue;pot=H.poder.reduce((s,v)=>s+v,0);g=GOLPES_JUX[h.id];}
    else{if(!POT_MAGIA[h.id])continue;pot=POT_MAGIA[h.id];g=GOLPES_JUX[h.id];}
    const area=AREA[h.id]?vivos.length:1,alvos=AREA[h.id]?vivos:[alvo];
    const r=alvos.reduce((s,e)=>s+reacao(e.tipo,g&&g.el,g&&g.t),0)/alvos.length;if(r<=0)continue;   // so nao usa se o inimigo absorve/e imune (antes pulava toda magia de gelo contra lobo e bolota, que resistem: o AUTO so atacava normal)
    const n=pot*r*area*(r>1?1.15:1);if(r<=1&&mp<C.neutro)continue;
    if(n>nota){nota=n;melhor={kind:h.id,alvo};}}
  if(melhor&&nota>25)return melhor;
  return {kind:'attack',alvo};
}
async function autoTurno(){G.busy=true;menu.open=false;await wait(G.vel===2?120:260);
  if(G.scene!=='battle'||!inimigos().length){G.busy=false;return;}
  const a=hero.quem==='bino'?autoEscolheBino():autoEscolhe();if(a.alvo&&!a.alvo.dead)enemy=a.alvo;G.busy=false;await heroTurn(a.kind);}

/* ---------- loop ---------- */
let last=performance.now();
// PAGINA ESCONDIDA (igual a vila_motor.js): sem desenhar a tela por mais de 1 s = cala a musica; volta quando desenhar de novo
let ultRAF=0,semRAF=false,tocavamRAF=[];
setInterval(()=>{if(semRAF||!ultRAF)return;if(performance.now()-ultRAF>1000){semRAF=true;tocavamRAF=[MUSICA,MUS_CINE,...Object.values(MUS_PROPRIA)].filter(a=>a&&!a.paused);for(const x of tocavamRAF)x.pause();}},300);
// um erro num quadro nao congela a luta: mostra (jogo.js mostraErro) e segue
function frame(now){try{frame0(now);}catch(e){try{for(let i=0;i<40;i++)ctx.restore();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.filter='none';ctx.globalCompositeOperation='source-over';}catch(_){}if(typeof mostraErro==='function')mostraErro(e);requestAnimationFrame(frame);}}
function frame0(now){if(window.__carregando){requestAnimationFrame(frame);return;}ultRAF=performance.now();if(semRAF){semRAF=false;if(!window.__morta&&!document.hidden)for(const x of tocavamRAF)x.play().catch(()=>{});tocavamRAF=[];}
  const dt=Math.min(.05,(now-last)/1000)*(G.vel||1);last=now;G.t+=dt;const t=G.t;
  stepTweens(dt);stepParts(dt);for(const a of aliados())if(!a.hold)a.at+=dt;
  if(G.scene==='battle')updateBattle(dt);
  ctx.save();ctx.clearRect(0,0,W,H);
  if(shake>.3){const ks=hero.quem==='bino'?.8:0;ctx.translate(rnd(-shake,shake)*ks,rnd(-shake,shake)*ks);shake*=.9;}else shake=0;   // a tela mexe bem menos para o Jux (atrapalhava ver o golpe)
  if(G.scene==='title'){if(G.encontro||ENC_PEND){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);}else drawTitle(ctx,t,dt);}else drawBattle(ctx,t,dt);   // vindo do mapa: tela preta em vez da tela inicial piscando
  ctx.restore();
  if(flash>.01){ctx.fillStyle=`rgba(255,255,255,${flash*(hero.quem==='bino'?1:0)})`;ctx.fillRect(0,0,W,H);flash*=.9;}
  if(G.scene!=='title')fxDesenhaTela(ctx,dt);   // clarao colorido, quadro de impacto, faixas de cinema
  drawBotoesAuto(ctx,t);
  drawPensamento(ctx,dt);
  drawCine(ctx,dt);
  requestAnimationFrame(frame);
}
function updateBattle(dt){
  if(performance.now()-(G.t0||0)<650)return;   // aquecimento: os desenhos dos inimigos sao decodificados com a tela quase transparente (antes apareciam piscando, como respawn)
  if(G.auto&&menu.open&&!G.busy&&!cine&&!(TESTE&&!G.lutaReal)){autoTurno();return;}
  if((TESTE&&!G.lutaReal)||G.busy||menu.open||cine)return;
  const vivosA=aliados().filter(a=>a.hp>0);
  for(const a of vivosA)if(a.atb<1)a.atb=Math.min(1,a.atb+dt*.2*statsDe(a).vel/10*multVelEst(a));
  // ORDEM DE TURNO POR VELOCIDADE (como no Final Fantasy): aliados e inimigos enchem a barra na MESMA escala; quem e mais rapido age antes e mais vezes,
  // quem tem a mesma velocidade alterna (1 turno para cada). So age em sequencia quem tem Pressa/arma/habilidade que acelere. e.vel = velocidade relativa ao heroi base.
  const velRef=statusBase(prog.nivel).vel;
  for(const e of inimigos())e.atb=Math.min(1,e.atb+dt*.2*(e.vel*velRef)/10*multVelEst(e)*(e.nevasca>0?.5:1));   // na nevasca: lento

  const pronto=vivosA.find(a=>a.atb>=1);
  if(pronto){hero=pronto;if(G.auto){autoTurno();return;}menu.open=true;menu.level='main';menu.idx=0;menu.top=0;som('ui_vez',.55);}
  else{const e=inimigos().find(e=>e.atb>=1);if(e)enemyTurn(e);}

function volPara(a,alvo,ms,fim){clearInterval(fades.get(a));const v0=a.volume,n=Math.max(1,Math.round(ms/40));let k=0;
  fades.set(a,setInterval(()=>{k++;a.volume=clamp(v0+(alvo-v0)*k/n,0,1);if(k>=n){clearInterval(fades.get(a));if(fim)fim();}},40));}

addEventListener('keydown',e=>{
  const k=e.key;
  if(cine){if(k==='Enter'||k===' '||k==='Escape'){pulaCine();e.preventDefault();}return;}
  if(k==='m'||k==='M'){musicaAlterna();return;}
  if(G.scene!=='battle'){if(k==='Enter'||k===' ')startOrRestart();return;}
  if(k==='q'||k==='Q'){trocaAuto();return;}if(k==='v'||k==='V'){trocaVel();return;}
  if(!menu.open||G.busy)return;
  if(k==='ArrowDown'||k==='s'){menu.idx=(menu.idx+1)%menuLen();fixTop();som('ui_mover',.45);}
  else if(k==='ArrowUp'||k==='w'){menu.idx=(menu.idx+menuLen()-1)%menuLen();fixTop();som('ui_mover',.45);}
  else if(k==='Enter'||k===' '||k==='z')choose(menu.idx);
  else if((k==='ArrowRight'||k==='d')&&menu.level==='alvo'){menu.idx=(menu.idx+1)%menuLen();som('ui_mover',.45);}
  else if((k==='ArrowLeft'||k==='a')&&menu.level==='alvo'){menu.idx=(menu.idx+menuLen()-1)%menuLen();som('ui_mover',.45);}
  else if(k==='Escape'||k==='x'){if(menu.level==='magic'){menu.level='main';menu.idx=1;menu.top=0;}
    else if(menu.level==='item'){menu.level='main';menu.idx=2;menu.top=0;}
    else if(menu.level==='alvo'){[menu.level,menu.idx]=menu.volta;menu.top=0;fixTop();}
    else if(menu.level==='res'){menu.level='main';menu.idx=4;menu.top=0;}}
  if(['ArrowDown','ArrowUp','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();

function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};}
function rowAt(p){if(!menu.open)return -1;for(let i=menu.top||0;i<Math.min(menuLen(),(menu.top||0)+VIS);i++){const r=menuRow(i);if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)return i;}return -1;}

function inimigoEm(p){const vivos=inimigos();for(let i=vivos.length-1;i>=0;i--){const [x,y]=w2s(vivos[i].x,vivos[i].y);if(Math.abs(p.x-x)<46&&p.y<y+6&&p.y>y-96)return i;}return -1;}

  mk('Vencer luta',async()=>{if(G.busy)return;prog.exp=Math.max(prog.exp,expPara(prog.nivel)-50);ENEMIES.forEach(e=>e.hp=0);await mortes();await win();nb.textContent='Nível '+prog.nivel;},'#7dffa8');
  const vels=[1,.5,.25,2];let vi=0;
  const vb=mk('Velocidade 1x',()=>{vi=(vi+1)%vels.length;G.vel=vels[vi];vb.textContent='Velocidade '+String(vels[vi]).replace('.',',')+'x';},'#d4dcff');
  if(!window.LAB_FIXO)mk('Voltar ao jogo',()=>trocaModo(false),'#ffffff');
  mk('Animações',()=>{location.href='anim_lab.html';},'#ffffff');
  barraAbas.appendChild(st);st.textContent='pronto';document.body.appendChild(box);
  {let a0='Golpes do Jux';try{a0=localStorage.getItem('jux_lab_aba')||a0;}catch(e){}abreAba(ABAS_LAB.includes(a0)?a0:'Golpes do Jux');}
}
